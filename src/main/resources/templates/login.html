<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | LocalZero</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-page">

<div class="auth-container">

    <h1>🌱 LocalZero</h1>

    <p>Login to access your local sustainability community</p>

    <form action="/login" method="post">

        <input
                type="email"
                name="email"
                placeholder="Email"
                required>

        <input
                type="password"
                name="password"
                placeholder="Password"
                required>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
    </p>

    <a class="auth-link" href="/register">
        Create account
    </a>

</div>

</body>
</html>
