<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Register | LocalZero</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body class="auth-page">

<div class="auth-container">

    <h1>🌱 Join LocalZero</h1>

    <p>Create your account and start helping your community</p>

    <form action="/register" method="post">

        <input
                type="text"
                name="name"
                placeholder="Full name"
                required>

        <input
                type="email"
                name="email"
                placeholder="Email"
                required>

        <input
                type="text"
                name="location"
                placeholder="Location">

        <input
                type="password"
                name="password"
                placeholder="Password"
                required>

        <button type="submit">

            Create account

        </button>

    </form>

    <p>
        Already have an account?
    </p>

    <a class="auth-link" href="/login">

        Login here

    </a>

</div>

</body>
</html>
