<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | LocalZero</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="auth-container">

    <h1>Create Account</h1>

    <p>Join your local sustainability network.</p>

    <form action="/register" method="post" class="auth-form">

        <input type="text"
               name="name"
               placeholder="Full name"
               required>

        <input type="text"
               name="location"
               placeholder="Location / Neighborhood"
               required>

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">
            Register
        </button>

    </form>

    <p>Already have an account?</p>

    <a href="/login">
        Login here
    </a>

</div>

</body>
</html>
