<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Register | LocalZero</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-page">

<div class="auth-container">

    <h1>🌱 Join LocalZero</h1>

    <p>Create your account and choose your neighborhood</p>

    <form action="/register" method="post">

        <input
                type="text"
                name="name"
                placeholder="Full name"
                required>

        <input
                type="email"
                name="email"
                placeholder="Email"
                required>

        <select name="location" required>
            <option value="">
                Choose Neighborhood
            </option>

            <option value="Neighborhood A">
                Neighborhood A
            </option>

            <option value="Neighborhood B">
                Neighborhood B
            </option>

            <option value="Neighborhood C">
                Neighborhood C
            </option>
        </select>

        <input
                type="password"
                name="password"
                placeholder="Password"
                required>

        <button type="submit">
            Create account
        </button>

    </form>

    <p>
        Already have an account?
    </p>

    <a class="auth-link" href="/login">
        Login here
    </a>

</div>

</body>
</html>
