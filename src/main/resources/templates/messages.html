<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Messages | LocalZero</title>

  <script src="/js/app.js" defer></script>

  <link rel="stylesheet"
        th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar">

  <h1 class="logo">🌱 LocalZero</h1>

  <div class="nav-links">
    <a href="/">Home</a>
    <a href="#">Initiatives</a>
    <a href="#">Eco Tracker</a>
    <a href="/messages">Messages</a>

    <a href="/logout" class="logout-button">
      Logout
    </a>
  </div>

</nav>

<div class="main-container">

  <section class="create-initiative-section">

    <h2>Messages</h2>

    <form th:action="@{/messages/send-form}" method="post">



      <select name="receiverId" required>

        <option value="">
          Choose recipient
        </option>

        <option th:each="user : ${users}"
                th:value="${user.id}"
                th:text="${user.name}">
        </option>

      </select>

      <input type="text"
             name="subject"
             placeholder="Subject"
             required>

      <textarea name="content"
                placeholder="Message"
                required></textarea>

      <button type="submit">
        Send Message
      </button>

    </form>

  </section>

  <section class="create-initiative-section">

    <h2>Inbox</h2>

    <div th:each="message : ${inbox}" class="dashboard-card">

      <h3 th:text="${message.subject}"></h3>

      <p>
        <strong>From:</strong>
        <span th:text="${message.sender.name}"></span>
      </p>

      <p th:text="${message.content}"></p>

    </div>

  </section>

  <section class="create-initiative-section">

    <h2>Sent Messages</h2>

    <div th:each="message : ${sent}" class="dashboard-card">

      <h3 th:text="${message.subject}"></h3>

      <p>
        <strong>To:</strong>
        <span th:text="${message.receiver.name}"></span>
      </p>

      <p th:text="${message.content}"></p>

    </div>

  </section>

</div>

</body>
</html>
